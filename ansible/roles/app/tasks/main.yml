---
# ansible/roles/app/tasks/main.yml

- name: Aktualizuj apt cache
  apt:
    update_cache: yes
    cache_valid_time: 3600

- name: Zainstaluj zależności
  apt:
    name:
      - python3
      - python3-pip
      - python3-venv
      - git
      - curl
    state: present

# ── Node Exporter (Prometheus scrape) ───────────────────────────────────────
- name: Utwórz użytkownika node_exporter
  user:
    name: node_exporter
    shell: /bin/false
    system: yes
    create_home: no

- name: Pobierz Node Exporter
  get_url:
    url: "https://github.com/prometheus/node_exporter/releases/download/v{{ node_exporter_version }}/node_exporter-{{ node_exporter_version }}.linux-amd64.tar.gz"
    dest: /tmp/node_exporter.tar.gz
    mode: '0644'

- name: Rozpakuj Node Exporter
  unarchive:
    src: /tmp/node_exporter.tar.gz
    dest: /tmp/
    remote_src: yes

- name: Skopiuj binarke node_exporter
  copy:
    src: "/tmp/node_exporter-{{ node_exporter_version }}.linux-amd64/node_exporter"
    dest: /usr/local/bin/node_exporter
    owner: node_exporter
    group: node_exporter
    mode: '0755'
    remote_src: yes

- name: Utwórz unit systemd dla node_exporter
  copy:
    dest: /etc/systemd/system/node_exporter.service
    content: |
      [Unit]
      Description=Node Exporter
      After=network.target

      [Service]
      User=node_exporter
      ExecStart=/usr/local/bin/node_exporter
      Restart=on-failure

      [Install]
      WantedBy=multi-user.target
    mode: '0644'
  notify: restart node_exporter

- name: Włącz i uruchom node_exporter
  systemd:
    name: node_exporter
    state: started
    enabled: yes
    daemon_reload: yes

